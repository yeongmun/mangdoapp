<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- 망도 손상조사 앱 심볼(원본 디자인, 2026-10-24): 남색 타일 위 교량 상판·교각 선과 그 위를 지나는 붉은 균열 폴리라인 -->
  <rect width="1024" height="1024" rx="224" fill="#1e3a5f"/>
  <!-- 상판 -->
  <rect x="152" y="448" width="720" height="56" rx="12" fill="#ffffff"/>
  <!-- 교각 둘 -->
  <rect x="300" y="504" width="64" height="300" rx="10" fill="#ffffff" opacity="0.92"/>
  <rect x="660" y="504" width="64" height="300" rx="10" fill="#ffffff" opacity="0.92"/>
  <!-- 기초 선 -->
  <rect x="200" y="804" width="624" height="22" rx="11" fill="#ffffff" opacity="0.55"/>
  <!-- 균열 폴리라인 (앱의 '선' 입력) -->
