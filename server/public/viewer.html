<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>망도 뷰어</title>
    <link rel="stylesheet" href="https://developer.api.autodesk.com/modelderivative/v2/viewers/7.*/style.min.css" />
    <link rel="stylesheet" href="viewer/viewer.css" />
    <script src="https://developer.api.autodesk.com/modelderivative/v2/viewers/7.*/viewer3D.min.js"></script>
  </head>
  <body>
    <div id="viewer"></div>
    <svg id="overlay" aria-hidden="true"></svg>

    <div id="toolbar" hidden>
      <select id="damageType" aria-label="손상 유형"></select>
      <button id="props" type="button" disabled>속성</button>
      <button id="fingerDraw" type="button" aria-pressed="false">손가락 그리기</button>
      <button id="undo" type="button" disabled>마지막 취소</button>
      <button id="delete" type="button" disabled>선택 삭제</button>
      <button id="coordCheck" type="button" aria-pressed="false">좌표 확인</button>
      <span id="saveStatus" class="status saved">저장됨</span>
    </div>

    <div id="propsPanel" hidden>
      <h2 id="propsTitle"></h2>
      <p id="propsSummary"></p>
      <label><span id="widthLabel">가로/폭 (mm)</span> <input id="widthInput" type="number" step="0.01" min="0" inputmode="decimal" /></label>
      <label>세로/길이 (m) <input id="lengthInput" type="number" step="0.01" min="0" inputmode="decimal" /></label>
      <label>개소 <input id="countInput" type="number" step="1" min="0" inputmode="numeric" /></label>
      <label>비고 <input id="noteInput" type="text" /></label>
      <label id="statusRow">손상현황 <input id="statusInput" type="text" /></label>
      <label>사진번호 <input id="photoInput" type="text" /> <span>쉼표로 구분</span></label>
      <p id="computedHint"></p>
      <p id="propsError" hidden></p>
      <div class="row">
        <button id="propsSave" type="button">저장</button>
        <button id="propsClose" type="button">닫기</button>
      </div>
    </div>

    <div id="coordPanel" hidden></div>
    <div id="warning" hidden></div>
    <div id="saveError" hidden></div>
    <div id="loading">도면을 불러오는 중…</div>
    <div id="error" hidden>
      <p id="errorText"></p>
      <button id="retry" type="button">다시 시도</button>
    </div>

    <script type="module" src="viewer/main.js"></script>
  </body>
</html>
